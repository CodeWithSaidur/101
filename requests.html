<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests | Luminary Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <section class="partner-search-section">
            <div class="search-card">
                <div class="search-header">
                    <div class="back-nav">
                        <button onclick="window.location.href='index.html'" class="back-btn">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                    </div>
                    <i class="fas fa-user-plus search-icon"></i>
                    <h1>Connection Requests</h1>
                    <p>Review and accept requests from partners wanting to connect.</p>
                </div>

                <div class="requests-list">
                    <!-- Mock Request 1 -->
                    <div class="request-item">
                        <div class="partner-preview">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Liam" alt="Partner"
                                class="avatar-lg">
                            <div class="partner-meta">
                                <h3>Liam Johnson</h3>
                                <span class="phone-muted">+1 555-0199</span>
                            </div>
                        </div>
                        <div class="request-actions">
                            <button class="accept-btn" onclick="acceptRequest(this)">Accept</button>
                            <button class="decline-btn" onclick="declineRequest(this)">Decline</button>
                        </div>
                    </div>

                    <!-- Mock Request 2 -->
                    <div class="request-item">
                        <div class="partner-preview">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sophia" alt="Partner"
                                class="avatar-lg">
                            <div class="partner-meta">
                                <h3>Sophia Miller</h3>
                                <span class="phone-muted">+1 555-0245</span>
                            </div>
                        </div>
                        <div class="request-actions">
                            <button class="accept-btn" onclick="acceptRequest(this)">Accept</button>
                            <button class="decline-btn" onclick="declineRequest(this)">Decline</button>
                        </div>
                    </div>
                </div>

                <div id="no-requests" class="hidden">
                    <p class="muted-text">No pending requests at the moment.</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        function acceptRequest(btn) {
            localStorage.setItem('connected', 'true');
            const card = btn.closest('.request-item');
            card.innerHTML = `
                <div class="status-content success-animation">
                    <i class="fas fa-check-circle" style="color: var(--online-color); font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                    <p>Connection Accepted!</p>
                </div>
            `;
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        function declineRequest(btn) {
            const card = btn.closest('.request-item');
            card.style.opacity = '0';
            card.style.transform = 'translateX(20px)';
            setTimeout(() => {
                card.remove();
                checkEmpty();
            }, 300);
        }

        function checkEmpty() {
            const list = document.querySelector('.requests-list');
            if (list.children.length === 0) {
                document.getElementById('no-requests').classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
