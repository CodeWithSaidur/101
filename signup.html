<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Luminary Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <div class="login-overlay">
        <div class="login-card">
            <div class="login-header">
                <h1>Create Account</h1>
                <p>Join the future of premium messaging</p>
            </div>
            <form action="login.html">
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <div class="field-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullname" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <div class="field-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="field-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="login-btn">Create Account</button>
                <div class="login-footer">
                    <span>Already have an account? <a href="login.html">Sign In</a></span>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
